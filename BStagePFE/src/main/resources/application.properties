spring.application.name=BStagePFE

# ============================================================
# BASE DE DONNÉES
# ✅ FIX CRITIQUE : Plus aucun credential hardcodé.
# Définir ces variables d'environnement avant de lancer l'app :
#
#   Linux/Mac  : export DB_URL=... DB_USERNAME=root DB_PASSWORD=...
#   Windows PS : $env:DB_PASSWORD="..."
#   Docker     : utiliser le .env file (voir .env.example)
#   IntelliJ   : Run > Edit Configurations > Environment Variables
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sndp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jackson.deserialization.use-big-decimal-for-floats=true

# ============================================================
# LOGGING SQL — DÉSACTIVÉ EN PRODUCTION
# Pour activer en développement, créer application-dev.properties
# avec ces lignes décommentées, puis lancer avec --spring.profiles.active=dev
# ============================================================
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================
# JWT
# ✅ La clé secrète vient de la variable d'environnement JWT_SECRET
# Elle doit faire au moins 32 caractères pour HS256.
# JAMAIS de valeur par défaut ici → l'app refuse de démarrer si absent.
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ============================================================
# MAIL (Mailtrap en dev, SMTP réel en prod)
# ✅ FIX CRITIQUE : credentials Mailtrap retirés du code source.
# ============================================================
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
